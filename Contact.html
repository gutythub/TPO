<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">

    <title>Contact - L Gutierrez</title>
    <link rel="stylesheet" href="CSS/styles.css" media="screen">
    <link rel="icon" href="IMG/Coffee.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <div class="grid-container">
        <header class="site-header bb pb2 pt4 ph5 mb4" role="banner">
            <a class="site-brand v-mid w-33" href="Index.html" title="Home">
                <img src="IMG/coffee.png" class="dib h2 w-auto db-1" alt="Coffee logo">
            </a>
            <nav class="site-nav w-100 dt-1" role="navigation">
                <div class="site-links v-mid mt3 ttu">

                    <a class="link h1 pv1 ph2 dib f6" href="/Contact.html" title="Contact">Contact</a>
                </div>
            </nav>
        </header>

        <main class="page-main pa4" role="main">
            <h1>Contact</h1>
            <form class="contact-form" action="mailto:example@example.com" method="post" enctype="text/plain">
                <label>Name:<br><input type="text" name="name" required></label><br>
                <label>Email:<br><input type="email" name="email" required></label><br>
                <label>Message:<br><textarea name="message" rows="5" required></textarea></label><br>
                <button type="submit">Send</button>
            </form>
        </main>
    </div>
</body>
